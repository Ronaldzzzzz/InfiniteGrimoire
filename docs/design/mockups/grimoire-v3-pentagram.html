<h2>魔導書 v3：五芒星混合（建議方案）</h2>
<p class="subtitle">外圈交界 = 相鄰混合（橘菱形）；中央五芒星 = 不相鄰混合（白菱形）。共 10 組，全部有位置。</p>

<style>
  .ig { background:#0d0f14; color:#d8e6c8; font-family: ui-monospace, Menlo, monospace; border-radius:8px; padding:10px; text-align:center; }
  .note { font-size:12px; color:#999; margin-top:6px; text-align:left; line-height:1.7; }
</style>

<div class="ig">
  <svg id="tree" width="100%" viewBox="0 0 700 700" style="max-width:700px"></svg>
</div>

<p class="note">
<b>結構：</b>五個初階節點剛好是五芒星的五個頂點。星的每一條線都連接兩個不相鄰的屬性，線的中點就是那一組的混合魔法。<br>
<b>建議（我的提議）：</b>相鄰混合（相生）門檻較低，成功率穩定。不相鄰混合（相悖）需要兩邊的高階前置，成功率較低、變異機率較高，最容易出現光暗變異。<br>
光暗魔導書維持 v2 的設計，這裡沒有畫。
</p>

<script>
(function(){
  var svg=document.getElementById('tree'), NS='http://www.w3.org/2000/svg', cx=350, cy=350;
  function el(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;svg.appendChild(e);return e;}
  function pt(r,deg){var a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a), cy+r*Math.sin(a)];}
  function diamond(x,y,s,fill,stroke){el('rect',{x:x-s,y:y-s,width:2*s,height:2*s,fill:fill,stroke:stroke,transform:'rotate(45 '+x+' '+y+')'});}
  var S=[
    {n:'火',c:'#e2643b',s:['火球術','烈焰術','爆炎','火牆','熔岩','流星','焚身'],L:7,t:'火屬性大魔導士',p:'50/50 ✔'},
    {n:'風',c:'#7fd0c0',s:['風刃','旋風','真空斬','疾風','龍捲','颶風','風壁'],L:3,t:'風之賢者',p:'12/50'},
    {n:'雷',c:'#f3e36b',s:['雷電術','閃電術','落雷','雷暴','連鎖雷','雷神槌','電磁網'],L:2,t:'雷霆主宰',p:'9/50'},
    {n:'土',c:'#c79a5a',s:['石礫','岩槍','地震','石膚','流沙','隕石','大地裂'],L:0,t:'大地守護者',p:'0/50'},
    {n:'水',c:'#5aa0e8',s:['水彈','冰錐','水流','冰封','潮汐','海嘯','凍結領域'],L:1,t:'深海之主',p:'4/50'}
  ];
  var adj=[['火焰旋風','熱風'],['雷雲','雷嵐'],['磁暴','電磁岩'],['泥沼','岩漿泥'],['蒸氣爆發','沸水']];
  var star=['爆雷','沙暴','感電霧','火山','暴風雪']; // pair (i, i+2)
  for(var i=0;i<5;i++){var p=pt(330,i*72+36);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'#2a3a2a','stroke-dasharray':'3 4'});}
  [185,245,305].forEach(function(r){el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:'#1c2620'});});
  var all=[];
  S.forEach(function(s,i){
    var b=i*72, N=[{r:120,d:0,p:null},{r:185,d:-14,p:0},{r:185,d:14,p:0},{r:250,d:-24,p:1},{r:250,d:-8,p:1},{r:250,d:8,p:2},{r:250,d:24,p:2}];
    N.forEach(function(n,k){var q=pt(n.r,b+n.d);n.x=q[0];n.y=q[1];n.on=k<s.L;});
    all.push(N);
  });
  // pentagram (behind nodes)
  S.forEach(function(s,i){
    var j=(i+2)%5, A=all[i][0], B=all[j][0], mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    var on=A.on&&B.on;
    el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:on?'#ffffff':'#555','stroke-width':on?2:1.2,'stroke-dasharray':on?'':'5 4'});
    S[i].mid=[mx,my,on];
  });
  S.forEach(function(s,i){
    var N=all[i];
    N.forEach(function(n){var f=n.p===null?null:N[n.p];if(!f)return;
      el('line',{x1:f.x,y1:f.y,x2:n.x,y2:n.y,stroke:n.on?s.c:'#33403a','stroke-width':n.on?2:1});});
    N.forEach(function(n,k){
      el('circle',{cx:n.x,cy:n.y,r:k===0?16:10,fill:n.on?s.c:'#151b18',stroke:s.c,'stroke-width':1.5});
      if(k===0) el('text',{x:n.x,y:n.y+5,fill:n.on?'#111':s.c,'font-size':14,'text-anchor':'middle','font-weight':'bold'},s.n);
      var lp=k===0?pt(n.r+30,i*72):[n.x,n.y+22];
      el('text',{x:lp[0],y:lp[1]+(k===0?4:0),fill:n.on?'#eee':'#6b7a70','font-size':10,'text-anchor':'middle'},s.s[k]);
    });
    var tp=pt(318,i*72);
    el('rect',{x:tp[0]-48,y:tp[1]-13,width:96,height:26,fill:'#0d0f14',stroke:s.c,rx:3});
    el('text',{x:tp[0],y:tp[1]-1,fill:s.c,'font-size':10,'text-anchor':'middle'},'稱號：'+s.t);
    el('text',{x:tp[0],y:tp[1]+10,fill:'#aaa','font-size':9,'text-anchor':'middle'},s.p);
  });
  // adjacent hybrids on boundaries
  S.forEach(function(s,i){
    var j=(i+1)%5, b=i*72+36, A=all[i][2], B=all[j][1], h1=pt(215,b), h2=pt(280,b), on=A.on&&B.on;
    [A,B].forEach(function(X){el('line',{x1:X.x,y1:X.y,x2:h1[0],y2:h1[1],stroke:on?'#ff9a3c':'#4a3a2a','stroke-dasharray':'4 3'});});
    el('line',{x1:h1[0],y1:h1[1],x2:h2[0],y2:h2[1],stroke:'#4a3a2a','stroke-dasharray':'4 3'});
    diamond(h1[0],h1[1],9,on?'#ff9a3c':'#151b18','#ff9a3c');
    diamond(h2[0],h2[1],8,'#151b18','#ff9a3c');
    el('text',{x:h1[0],y:h1[1]+24,fill:on?'#ffcf9a':'#8a6a4a','font-size':10,'text-anchor':'middle'},adj[i][0]);
    el('text',{x:h2[0],y:h2[1]+22,fill:'#8a6a4a','font-size':10,'text-anchor':'middle'},adj[i][1]);
  });
  // star hybrids at diagonal midpoints
  S.forEach(function(s,i){
    var m=s.mid; diamond(m[0],m[1],7,m[2]?'#ffffff':'#151b18','#ffffff');
    var lp=pt(62,(i+1)*72);
    el('text',{x:lp[0],y:lp[1]+4,fill:m[2]?'#fff':'#999','font-size':10,'text-anchor':'middle'},star[i]);
  });
})();
</script>
