<h2>魔導書 v2：混合節點 + 光暗魔導書</h2>
<p class="subtitle">點上方按鈕切換兩本魔導書。</p>

<style>
  .ig { background:#0d0f14; color:#d8e6c8; font-family: ui-monospace, Menlo, monospace; border-radius:8px; padding:10px; text-align:center; }
  .bk { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
  .bk button { background:#151b18; color:#aaa; border:1px solid #3a4a3a; padding:6px 14px; font-family:inherit; cursor:pointer; }
  .bk button.on { background:#e8b84a; color:#0d0f14; border-color:#e8b84a; }
  .note { font-size:12px; color:#999; margin-top:6px; text-align:left; }
</style>

<div class="ig">
  <div class="bk">
    <button id="b5" class="on">五屬魔導書</button>
    <button id="bld">光暗魔導書（條件已達成，可切換）</button>
  </div>
  <svg id="tree5" width="100%" viewBox="0 0 640 640" style="max-width:640px"></svg>
  <svg id="treeLD" width="100%" viewBox="0 0 640 520" style="max-width:640px; display:none"></svg>
</div>

<p class="note">
<b>五屬魔導書：</b>相鄰兩屬性的交界處新增混合魔法節點（橘框），要兩邊的前置魔法都學會才能點。<br>
<b>光暗魔導書：</b>左光右暗，中間是硬分界，沒有混合區。一開始只開放少量見習節點，其餘封印；達成轉職條件並捨棄五屬魔導書後，才解放完整的樹。
</p>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function mk(svg){return function(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;svg.appendChild(e);return e;};}

  // ---------- five-element book ----------
  var s5=document.getElementById('tree5'), el=mk(s5), cx=320, cy=320;
  function pt(r,deg){var a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a), cy+r*Math.sin(a)];}
  var sectors=[
    {n:'火',c:'#e2643b',s:['火球術','烈焰術','爆炎','火牆','熔岩','流星','焚身'],learned:7,title:'火屬性大魔導士',prog:'50/50 ✔'},
    {n:'風',c:'#7fd0c0',s:['風刃','旋風','真空斬','疾風','龍捲','颶風','風壁'],learned:3,title:'風之賢者',prog:'12/50'},
    {n:'雷',c:'#f3e36b',s:['雷電術','閃電術','落雷','雷暴','連鎖雷','雷神槌','電磁網'],learned:2,title:'雷霆主宰',prog:'9/50'},
    {n:'土',c:'#c79a5a',s:['石礫','岩槍','地震','石膚','流沙','隕石','大地裂'],learned:0,title:'大地守護者',prog:'0/50'},
    {n:'水',c:'#5aa0e8',s:['水彈','冰錐','水流','冰封','潮汐','海嘯','凍結領域'],learned:1,title:'深海之主',prog:'4/50'}
  ];
  var hybrids=[['火焰旋風','熱風'],['雷雲','雷嵐'],['磁暴','電磁岩'],['泥沼','岩漿泥'],['蒸氣爆發','沸水']];
  for(var i=0;i<5;i++){var p=pt(300,i*72+36);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'#2a3a2a','stroke-dasharray':'3 4'});}
  [80,150,220,285].forEach(function(r){el('circle',{cx:cx,cy:cy,r:r,fill:'none',stroke:'#1c2620'});});
  var all=[];
  sectors.forEach(function(s,i){
    var base=i*72;
    var nodes=[{r:80,d:0,p:null},{r:150,d:-14,p:0},{r:150,d:14,p:0},{r:220,d:-22,p:1},{r:220,d:-7,p:1},{r:220,d:7,p:2},{r:220,d:22,p:2}];
    nodes.forEach(function(n,k){var q=pt(n.r,base+n.d);n.x=q[0];n.y=q[1];n.on=k<s.learned;
      var f=n.p===null?[cx,cy]:[nodes[n.p].x,nodes[n.p].y];
      el('line',{x1:f[0],y1:f[1],x2:n.x,y2:n.y,stroke:n.on?s.c:'#33403a','stroke-width':n.on?2:1});});
    nodes.forEach(function(n,k){
      el('circle',{cx:n.x,cy:n.y,r:k===0?13:10,fill:n.on?s.c:'#151b18',stroke:s.c,'stroke-width':1.5});
      el('text',{x:n.x,y:n.y+22,fill:n.on?'#eee':'#6b7a70','font-size':10,'text-anchor':'middle'},s.s[k]);});
    all.push(nodes);
    var tp=pt(292,base);
    el('rect',{x:tp[0]-46,y:tp[1]-13,width:92,height:26,fill:'#0d0f14',stroke:s.c,rx:3});
    el('text',{x:tp[0],y:tp[1]-1,fill:s.c,'font-size':10,'text-anchor':'middle'},'稱號：'+s.title);
    el('text',{x:tp[0],y:tp[1]+10,fill:'#aaa','font-size':9,'text-anchor':'middle'},s.prog);
    var lp=pt(42,base);el('text',{x:lp[0],y:lp[1]+5,fill:s.c,'font-size':14,'text-anchor':'middle','font-weight':'bold'},s.n);
  });
  // hybrid nodes on each boundary between sector i and i+1
  sectors.forEach(function(s,i){
    var j=(i+1)%5, b=i*72+36, A=all[i][2], B=all[j][1];
    var h1=pt(185,b), h2=pt(250,b);
    var on1=A.on&&B.on;
    [[A,h1],[B,h1]].forEach(function(l){el('line',{x1:l[0].x,y1:l[0].y,x2:l[1][0],y2:l[1][1],stroke:on1?'#ff9a3c':'#4a3a2a','stroke-dasharray':'4 3'});});
    el('line',{x1:h1[0],y1:h1[1],x2:h2[0],y2:h2[1],stroke:'#4a3a2a','stroke-dasharray':'4 3'});
    el('rect',{x:h1[0]-9,y:h1[1]-9,width:18,height:18,fill:on1?'#ff9a3c':'#151b18',stroke:'#ff9a3c',transform:'rotate(45 '+h1[0]+' '+h1[1]+')'});
    el('rect',{x:h2[0]-8,y:h2[1]-8,width:16,height:16,fill:'#151b18',stroke:'#ff9a3c',transform:'rotate(45 '+h2[0]+' '+h2[1]+')'});
    el('text',{x:h1[0],y:h1[1]+24,fill:on1?'#ffcf9a':'#8a6a4a','font-size':10,'text-anchor':'middle'},hybrids[i][0]);
    el('text',{x:h2[0],y:h2[1]+22,fill:'#8a6a4a','font-size':10,'text-anchor':'middle'},hybrids[i][1]);
  });
  el('circle',{cx:cx,cy:cy,r:20,fill:'#0d0f14',stroke:'#e8b84a','stroke-width':2});
  el('text',{x:cx,y:cy+4,fill:'#e8b84a','font-size':10,'text-anchor':'middle'},'魔導書');

  // ---------- light / dark book ----------
  var sl=document.getElementById('treeLD'), e2=mk(sl);
  e2('rect',{x:0,y:0,width:320,height:520,fill:'#1a1810'});
  e2('rect',{x:320,y:0,width:320,height:520,fill:'#120d1a'});
  e2('line',{x1:320,y1:10,x2:320,y2:510,stroke:'#e8b84a','stroke-width':3});
  e2('text',{x:160,y:30,fill:'#fff3c4','font-size':16,'text-anchor':'middle','font-weight':'bold'},'光');
  e2('text',{x:480,y:30,fill:'#c9a0ff','font-size':16,'text-anchor':'middle','font-weight':'bold'},'暗');
  function side(dir,col,names,root){
    var ox=320+dir*40, nodes=[
      {x:ox,y:260,p:null},
      {x:ox+dir*70,y:200,p:0},{x:ox+dir*70,y:320,p:0},
      {x:ox+dir*140,y:150,p:1},{x:ox+dir*140,y:240,p:1},{x:ox+dir*140,y:290,p:2},{x:ox+dir*140,y:370,p:2},
      {x:ox+dir*215,y:120,p:3},{x:ox+dir*215,y:200,p:4},{x:ox+dir*215,y:330,p:5},{x:ox+dir*215,y:410,p:6},
      {x:ox+dir*260,y:265,p:null}
    ];
    nodes.forEach(function(n,k){if(n.p===null)return;var f=nodes[n.p];
      e2('line',{x1:f.x,y1:f.y,x2:n.x,y2:n.y,stroke:k<3?col:'#3a3540','stroke-width':k<3?2:1});});
    nodes.forEach(function(n,k){
      if(k===11){
        e2('rect',{x:n.x-40,y:n.y-14,width:80,height:28,fill:'#0d0f14',stroke:col,rx:3,'stroke-dasharray':'3 2'});
        e2('text',{x:n.x,y:n.y+4,fill:col,'font-size':10,'text-anchor':'middle'},root);return;}
      var open=k<3;
      e2('circle',{cx:n.x,cy:n.y,r:k===0?13:10,fill:open?col:'#151318',stroke:open?col:'#4a4550','stroke-width':1.5});
      e2('text',{x:n.x,y:n.y+(open?4:4),fill:open?'#111':'#555','font-size':open?9:11,'text-anchor':'middle'},open?'':'🔒');
      e2('text',{x:n.x,y:n.y+24,fill:open?'#eee':'#5a5560','font-size':10,'text-anchor':'middle'},names[k]||'');
    });
  }
  side(-1,'#fff3c4',['聖光','治癒光','光矢','','','','','','','',''],'稱號：光之魔導士');
  side(1,'#c9a0ff',['暗影','詛咒','暗刃','','','','','','','',''],'稱號：暗之魔導士');
  e2('rect',{x:120,y:450,width:400,height:56,fill:'#0d0f14',stroke:'#e8b84a',rx:4});
  e2('text',{x:320,y:472,fill:'#e8b84a','font-size':12,'text-anchor':'middle'},'🔒 封印節點：轉職後解放');
  e2('text',{x:320,y:492,fill:'#aaa','font-size':11,'text-anchor':'middle'},'轉職條件：??? ＋ 捨棄五屬魔導書');

  var b5=document.getElementById('b5'), bld=document.getElementById('bld');
  b5.onclick=function(){s5.style.display='';sl.style.display='none';b5.className='on';bld.className='';};
  bld.onclick=function(){s5.style.display='none';sl.style.display='';bld.className='on';b5.className='';};
})();
</script>
